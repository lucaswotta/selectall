[package]
name = "selectall-app"
description = "Janela do SelectAll: comandos sobre o núcleo."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "selectall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selectall-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[features]
# Serve a interface a partir do binário em vez do servidor de desenvolvimento; ativado por `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

[package]
name = "selectall-core"
description = "Frota, armazenamento local e execução de SQL em massa do SelectAll, sem interface."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
calamine = "0.36"
csv = "1.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
webpki-roots = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[lints]
workspace = true
